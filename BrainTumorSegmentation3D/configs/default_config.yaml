# Stand-alone 3D project defaults for a 6 GB laptop GPU.
# Spatial sizes are always written in tensor order: [D, H, W].

paths:
  training_root: "../../BraTS2020_TrainingData/MICCAI_BraTS2020_TrainingData"
  artifacts_root: "../artifacts"
  manifest_file: "../data/manifest_3d.json"
  # Reuse only the patient IDs/splits from the completed 2D project. The 2D
  # PNG files, source code, checkpoints, and result files are never modified.
  legacy_splits_file: "../../BrainTumorSegmentation/data_processed/splits.json"

dataset:
  modality: "flair"
  label_suffix: "seg"
  patch_size: [64, 96, 96]
  patches_per_patient: 2
  positive_patch_ratio: 0.75
  cache_size: 1
  normalization_epsilon: 1.0e-6
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  reuse_legacy_splits: true
  expected_training_patients: 369
  augmentation:
    enabled: true
    flip_probability: 0.5
    intensity_scale: 0.10
    intensity_shift: 0.10
    noise_std: 0.01

training:
  device: "auto"
  epochs: 50
  batch_size: 1
  num_workers: 0
  pin_memory: true
  learning_rate: 0.0001
  weight_decay: 0.00001
  base_channels: 16
  in_channels: 1
  out_channels: 1
  threshold: 0.5
  mixed_precision: true
  gradient_accumulation_steps: 4
  gradient_clip_norm: 1.0
  validate_every: 5
  scheduler_factor: 0.5
  scheduler_patience: 5
  minimum_learning_rate: 0.000001

inference:
  # Full volumes are reconstructed from overlapping patches; never filter out
  # tumour-free slices at validation/test time.
  batch_size: 1
  roi_size: [64, 96, 96]
  sw_batch_size: 1
  # 0.25 keeps local 6 GB sliding-window evaluation manageable while still
  # providing overlap at patch boundaries.
  overlap: 0.25
  padding_mode: "constant"
  padding_value: 0.0

evaluation:
  split: "test"
  save_nifti: false
  save_probabilities: false

experiments:
  - name: "unet_bce"
    model: "unet"
    loss: "bce"
    bce_weight: 1.0
    dice_weight: 0.0
  - name: "unet_bce_dice"
    model: "unet"
    loss: "bce_dice"
    bce_weight: 1.0
    dice_weight: 1.0
  - name: "attention_unet_bce_dice"
    model: "attention_unet"
    loss: "bce_dice"
    bce_weight: 1.0
    dice_weight: 1.0
